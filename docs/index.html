<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SiuCloud | Your Cloud, Simplified</title>
  <meta name="description" content="Cloud strategy, optimization, and security for SMBs—simple, effective, and growth-ready." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="author" content="SiuCloud.org" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0f12;            /* charcoal */
      --bg-soft: #12171b;       /* slate */
      --panel: rgba(255,255,255,0.03);
      --text: #e6edf3;          /* light */
      --muted: #93a1ad;         /* medium gray */
      --accent: #00c2a8;        /* teal */
      --accent-2: #00a08f;      /* darker teal */
      --border: rgba(230, 237, 243, 0.12);
      --radius: 14px;
      --radius-sm: 10px;
      --maxw: 1100px;
      --space: clamp(16px, 2.2vw, 24px);
      --space-lg: clamp(28px, 4vw, 56px);
      --illus-size: clamp(120px, 12vw, 160px);
    }

    /* Reset & base */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-2); }
    h1, h2, h3, h4 { margin: 0 0 0.6em; line-height: 1.15; color: var(--text); }
    
    .container { width: min(100% - 2rem, var(--maxw)); margin-inline: auto; }
    .section { padding-block: var(--space-lg); }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      color: #041716;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border: none; border-radius: 999px;
      padding: 12px 20px; font-weight: 600;
      transition: transform 150ms ease;
      cursor: pointer;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn.alt { background: transparent; color: var(--accent); border: 1px solid var(--border); }

    /* Navigation */
    .nav-wrap {
      position: sticky; top: 0; z-index: 50;
      background: rgba(18, 23, 27, 0.7);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(6px);
    }
    .nav { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--text); }
    .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; }
    .nav-links { display: flex; gap: clamp(10px, 2vw, 20px); }
    .nav-links a { color: var(--text); font-weight: 500; padding: 6px; }
    
    #user-info { display: none; align-items: center; gap: 12px; color: var(--accent); font-weight: 600; }
    #signOut { cursor: pointer; font-size: 0.8em; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; background: var(--panel); }

    footer { border-top: 1px solid var(--border); background: var(--bg-soft); padding-block: var(--space); text-align: center; }
    img { width: 100vw; display: block; }
  </style>

  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17764280720"></script> 
  <script> 
    window.dataLayer = window.dataLayer || []; 
    function gtag(){dataLayer.push(arguments);} 
    gtag('js', new Date()); 
    gtag('config', 'AW-17764280720'); 
  </script> 
</head>

<body>
  <div class="nav-wrap">
    <div class="container nav">
      <div class="brand">
        <span class="dot"></span>
        <span>SiuCloud</span>
      </div>

      <nav class="nav-links" id="navLinks">
        <a href="#home">Home</a>
        <a href="#services">Services</a>
        <a href="#faq">FAQ</a>
        <a href="#consultation">Consultation</a>
        
        <a href="javascript:void(0)" id="signIn" onclick="window.triggerLogin(event)">
          <i class="fa-solid fa-user-lock"></i> Sign In
        </a>
        
        <span id="user-info">
            <i class="fa-solid fa-circle-user"></i> <span id="user-email"></span>
            <button id="signOut">Logout</button>
        </span>
      </nav>

      <div class="nav-cta">
        <a class="btn alt" href="https://siucloud.org/images/Siu1.pdf" target="_blank">
          <i class="fa-solid fa-download"></i> Catalog
        </a>
      </div>
    </div>
  </div>

  <header id="home" class="section">
    <img src="https://raw.githubusercontent.com/SIUNETWORKSGitHub/SIU-RESUME/refs/heads/master/docs/images/New_picture.png"/>
    <div class="container" style="text-align: center; margin-top: 40px;">
      <h1>Your Cloud, Simplified</h1>
      <p style="max-width: 800px; margin-inline: auto;">
        We help SMBs cut cloud complexity and costs while improving security and performance.
      </p>
      <div style="margin-top: 30px;">
        <a class="btn" href="#consultation"><i class="fa-solid fa-calendar-check"></i> Book a Free Call</a>
      </div>
    </div>
  </header>

  <footer id="consultation">
    <div class="container">
      <p>© 2014-2026 SiuCloud.org</p>
    </div>
  </footer>

  <script type="module">
    // Cache-buster v=FINAL ensures GitHub serves the newest logic
    import { userManager, signOutRedirect } from "./main.js?v=FINAL";

    // GLOBAL TRIGGER: Attached to window so the HTML 'onclick' can find it immediately
    window.triggerLogin = (e) => {
        if (e) e.preventDefault();
        console.log("SiuCloud Auth: Triggering AWS Login...");
        userManager.signinRedirect().catch(err => alert("Auth Error: " + err.message));
    };

    window.addEventListener('load', () => {
        const signOutBtn = document.getElementById("signOut");

        if (signOutBtn) {
            signOutBtn.onclick = (e) => {
                e.preventDefault();
                signOutRedirect();
            };
        }

        userManager.signinCallback().then((user) => {
            const url = new URL(window.location.href);
            url.searchParams.delete("code");
            url.searchParams.delete("state");
            url.searchParams.delete("session_state");
            window.history.replaceState({}, document.title, url.pathname + url.hash);
            if (user) showUser(user);
        }).catch(() => {
            userManager.getUser().then((user) => { if (user) showUser(user); });
        });

        function showUser(user) {
            document.getElementById("signIn").style.display = "none";
            document.getElementById("user-info").style.display = "inline-flex";
            document.getElementById("user-email").textContent = user.profile.email;
        }
    });
  </script>
</body>
</html>
