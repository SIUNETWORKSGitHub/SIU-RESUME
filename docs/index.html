<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SiuCloud | Your Cloud, Simplified</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0f12;
      --bg-soft: #12171b;
      --panel: rgba(255,255,255,0.03);
      --text: #e6edf3;
      --accent: #00c2a8;
      --border: rgba(230, 237, 243, 0.12);
      --radius: 14px;
      --maxw: 1100px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      color: var(--text);
      background: var(--bg);
      padding-top: 70px;
    }

    /* NAVIGATION */
    .nav-wrap {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 9999;
      background: rgba(11, 15, 18, 0.95);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }
    .nav {
      width: min(100% - 2rem, var(--maxw));
      margin-inline: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-block: 15px;
    }
    .nav-links { display: flex; gap: 1.5rem; align-items: center; }
    .nav-links a { color: var(--text); text-decoration: none; font-weight: 500; font-size: 0.95rem; }
    .nav-links a:hover { color: var(--accent); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

    #user-info { display: none; align-items: center; gap: 10px; color: var(--accent); font-weight: 600; }
    #signOut { cursor: pointer; font-size: 0.75rem; color: #93a1ad; border: 1px solid var(--border); border-radius: 4px; padding: 4px 10px; background: transparent; color: white; transition: 0.2s; }
    #signOut:hover { background: #ff4d4d; color: white; border-color: #ff4d4d; }

    .container { width: min(100% - 2rem, var(--maxw)); margin-inline: auto; }
    .section { padding-block: 100px; scroll-margin-top: 100px; }
    
    img { width: 100%; height: auto; display: block; border-radius: var(--radius); }
    
    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
      margin-top: 20px;
      text-align: center;
    }
    .service-desc h4 { color: var(--accent); margin-bottom: 10px; }

    .btn { background: var(--accent); color: #000; padding: 12px 24px; border-radius: 50px; font-weight: 600; text-decoration: none; border:none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: transform 0.2s; }
    .btn:hover { transform: scale(1.05); }
    
    footer { border-top: 1px solid var(--border); background: var(--bg-soft); padding-block: 40px; text-align: center; }
  </style>
</head>
