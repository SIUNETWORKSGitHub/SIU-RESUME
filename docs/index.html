<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SiuCloud | Your Cloud, Simplified</title>
  <meta name="description" content="Cloud strategy, optimization, and security for SMBs—simple, effective, and growth-ready." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="author" content="SiuCloud.org" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0f12;
      --bg-soft: #12171b;
      --panel: rgba(255,255,255,0.03);
      --text: #e6edf3;
      --muted: #93a1ad;
      --accent: #00c2a8;
      --accent-2: #00a08f;
      --border: rgba(230, 237, 243, 0.12);
      --radius: 14px;
      --radius-sm: 10px;
      --maxw: 1100px;
      --space: clamp(16px, 2.2vw, 24px);
      --space-lg: clamp(28px, 4vw, 56px);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; } /* Makes clicking links feel nice */
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    /* --- CRITICAL FIX: STICKY NAVIGATION --- */
    .nav-wrap {
      position: fixed; /* Changed from sticky to fixed for maximum reliability */
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      z-index: 9999; /* Higher than everything else */
      background: rgba(11, 15, 18, 0.95); /* Dark background with slight transparency */
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
      padding-block: 5px;
    }
    
    /* Prevents content from being hidden under the fixed nav */
    body { padding-top: 70px; } 

    .nav {
      width: min(100% - 2rem, var(--maxw));
      margin-inline: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.2rem; }
    .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

    .nav-links { display: flex; gap: 1.5rem; align-items: center; }
    .nav-links a { color: var(--text); text-decoration: none; font-weight: 500; font-size: 0.95rem; transition: color 0.2s; }
    .nav-links a:hover { color: var(--accent); }

    /* Buttons & Cards Styling */
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
    .btn { background: var(--accent); color: #000; padding: 10px 20px; border-radius: 50px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
    .btn.alt { background: transparent; color: var(--accent); border: 1px solid var(--accent); }

    /* Auth Styling */
    #user-info { display: none; align-items: center; gap: 10px; color: var(--accent); font-weight: 600; }
    #signOut { cursor: pointer; font-size: 0.75rem; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; background: transparent; }

    img { width: 100%; height: auto; display: block; }
    .section { padding-block: var(--space-lg); scroll-margin-top: 100px; } /* Ensures section isn't hidden by nav when clicking */
  </style>

  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17764280720"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-17764280720');
  </script>
</head>

<body>
  <div class="nav-wrap">
    <div class="nav">
      <div class="brand">
        <span class="dot"></span>
        <span>SiuCloud</span>
      </div>

      <nav class="nav-links">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#casestudies">Stories</a>
        <a href="#testimonials">Testimonials</a>
        <a href="#faq">FAQ</a>
        <a href="#consultation">Consultation</a>
        
        <a href="javascript:void(0)" id="signIn"><i class="fa-solid fa-user-lock"></i> Sign In</a>
        
        <span id="user-info">
            <i class="fa-solid fa-circle-user"></i> <span id="user-email"></span>
            <button id="signOut">Logout</button>
        </span>
      </nav>
    </div>
  </div>

  <header id="home" class="section">
    <img src="https://raw.githubusercontent.com/SIUNETWORKSGitHub/SIU-RESUME/refs/heads/master/docs/images/New_picture.png" style="width: 100vw;"/>
    <div style="text-align: center; padding: 40px;">
      <h1>Your Cloud, Simplified</h1>
      <p>Helping SMBs cut cloud complexity and costs while improving security.</p>
      <div style="display: flex; justify-content: center; gap: 15px;">
        <a class="btn" href="#consultation">Book a Call</a>
        <a class="btn alt" href="#services">Explore Services</a>
      </div>
    </div>
  </header>

  <script type="module">
    import { userManager, signOutRedirect } from "./main.js";

    const signInBtn = document.getElementById("signIn");
    const signOutBtn = document.getElementById("signOut");
    const userInfo = document.getElementById("user-info");
    const userEmail = document.getElementById("user-email");

    signInBtn.addEventListener("click", () => userManager.signinRedirect());
    signOutBtn.addEventListener("click", () => signOutRedirect());

    userManager.signinCallback().then((user) => {
        const url = new URL(window.location.href);
        url.searchParams.delete("code");
        url.searchParams.delete("state");
        window.history.replaceState({}, document.title, url.pathname + url.hash);
        if (user) showUser(user);
    }).catch(() => {
        userManager.getUser().then((user) => { if (user) showUser(user); });
    });

    function showUser(user) {
        signInBtn.style.display = "none";
        userInfo.style.display = "inline-flex";
        userEmail.textContent = user.profile.email;
    }
  </script>
</body>
</html>
